<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Projects — Jamka Zulkhuu</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

<style>
:root{
  --pink:#fffffd;--ink:#0a0a0a;--muted:#8a8672;--card:#fffffd;
  --line:#eeeadf;--line2:#e8e4d6;--hover:#fff9c9;--hl:#d9a800;
  --navbg:#000;--accent:#ffe033;--accent-bg:rgba(255,224,51,.18);
  --chip:#f3efe0;
  --sans:'Inter','Helvetica Neue',Arial,sans-serif;
}
html[data-theme="dark"]{
  --pink:#070a12;--card:#070a12;--ink:#eef2fa;--muted:#8b95aa;
  --line:#151b29;--line2:#1d2536;--hover:rgba(91,157,255,.12);--hl:#5b9dff;
  --accent:#5b9dff;--accent-bg:rgba(91,157,255,.2);--navbg:#131a28;
  --chip:#131a28;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth;background:var(--pink)}
body{margin:0;background:var(--pink);color:var(--ink);font-family:var(--sans);
  -webkit-font-smoothing:antialiased;transition:background .35s ease,color .35s ease}
a{color:inherit;text-decoration:none}

/* NAV */
.nav{position:fixed;top:52px;left:50%;transform:translateX(-50%);z-index:50;display:flex;
  align-items:center;gap:4px;padding:6px;background:var(--navbg);border-radius:999px;transition:background .35s ease}
.nav .sun{width:34px;height:34px;display:grid;place-items:center;color:#bbb;background:none;border:0;padding:0;
  cursor:pointer;border-radius:999px;transition:color .2s}
.nav .sun:hover{color:var(--accent)}
.nav .sun .moon{display:none}
html[data-theme="dark"] .nav .sun .sunsvg{display:none}
html[data-theme="dark"] .nav .sun .moon{display:block}
.nav a{padding:8px 14px;border-radius:999px;font-size:15px;font-weight:500;color:#9a9a9a;transition:color .2s,background .2s}
.nav a:hover{color:#fff}
.nav a.active{color:var(--accent);background:var(--accent-bg)}

/* HEADER */
.top{position:relative;padding:190px 52px 70px}
.top::before{content:"";position:absolute;inset:0;pointer-events:none;
  background:radial-gradient(ellipse 60% 100% at 50% 0%,rgba(255,224,51,.7) 0%,rgba(255,240,130,0) 100%);transition:opacity .3s}
html[data-theme="dark"] .top::before{
  background:radial-gradient(ellipse 60% 100% at 50% 0%,rgba(60,130,255,.55) 0%,rgba(60,130,255,0) 100%)}
.top > *{position:relative}
.top h1{margin:0;font-size:clamp(48px,11vw,170px);line-height:.92;letter-spacing:-.065em;font-weight:700;text-transform:uppercase}
.top p{margin:18px 0 0;font-size:clamp(18px,2.2vw,32px);letter-spacing:-.02em;color:var(--muted)}

/* LIST */
.list{padding:0 52px 120px}
.label{margin:0 0 28px;font-size:15px;font-weight:500;color:var(--muted)}
.proj{border-top:1px solid var(--line2)}
.proj:last-child{border-bottom:1px solid var(--line2)}
.head{width:100%;display:grid;grid-template-columns:1fr auto;align-items:baseline;gap:24px;padding:34px 0;
  background:none;border:0;color:inherit;font:inherit;text-align:left;cursor:pointer;
  transition:padding .25s ease,background .25s ease}
.head:hover,.proj.open .head{padding-left:18px;padding-right:18px;background:var(--hover)}
.head h3{margin:0;font-size:clamp(26px,4.6vw,68px);line-height:1;font-weight:600;letter-spacing:-.05em}
.head .role{margin:12px 0 0;font-size:clamp(15px,1.6vw,22px);color:var(--muted);letter-spacing:-.02em}
.head .meta{display:flex;align-items:center;gap:16px;font-size:15px;color:var(--muted);white-space:nowrap}
.head .plus{font-size:26px;line-height:1;transition:transform .25s ease}
.proj.open .plus{transform:rotate(45deg)}

.body{display:grid;grid-template-rows:0fr;transition:grid-template-rows .35s ease}
.proj.open .body{grid-template-rows:1fr}
.body > div{overflow:hidden}
.inner{padding:10px 18px 44px;display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);gap:40px}
.desc{margin:0;font-size:clamp(17px,1.5vw,22px);line-height:1.5;letter-spacing:-.015em;max-width:640px}
.tags{display:flex;flex-wrap:wrap;gap:8px;margin-top:22px}
.tags span{padding:6px 12px;border-radius:999px;background:var(--chip);font-size:13px;font-weight:500}
.links{display:flex;gap:26px;margin-top:26px;flex-wrap:wrap}
.links a{font-size:17px;font-weight:500;border-bottom:2px solid var(--ink);padding-bottom:2px;transition:color .2s,border-color .2s}
.links a:hover{color:var(--hl);border-color:var(--hl)}

.media{display:flex;gap:14px;overflow-x:auto;scroll-snap-type:x mandatory;padding-bottom:6px}
.media img,.media iframe,.media video{flex:0 0 auto;scroll-snap-align:start;border-radius:18px;border:1px solid var(--line2);background:var(--chip)}
.media img{height:420px;width:auto;max-width:100%}
.media iframe{width:230px;height:480px}
.media video{height:420px}

.empty{padding:60px 0;color:var(--muted);font-size:18px;line-height:1.6;max-width:640px}
.empty code{background:var(--chip);padding:2px 8px;border-radius:6px;font-size:.9em}

.foot{padding:0 52px 50px;font-size:13px;color:var(--muted)}

.fade{opacity:0;transform:translateY(14px);animation:up .7s ease forwards}
@keyframes up{to{opacity:1;transform:none}}
@media(prefers-reduced-motion:reduce){.fade{opacity:1;transform:none;animation:none}}

html.theming *,html.theming *::before,html.theming *::after{
  transition:background-color .3s ease,color .3s ease,border-color .3s ease,opacity .3s ease !important}

@media(max-width:760px){
  .nav{top:22px}.nav a{padding:7px 10px;font-size:14px}
  .top{padding:130px 20px 50px}.list{padding:0 20px 80px}.foot{padding:0 20px 40px}
  .head{grid-template-columns:1fr;gap:10px}
  .inner{grid-template-columns:1fr;gap:26px;padding:10px 0 36px}
  .head:hover,.proj.open .head{padding-left:0;padding-right:0}
  .media img{height:320px}
}
</style>
</head>
<body>

<div class="nav" id="nav">
  <button class="sun" id="theme" type="button" aria-label="Toggle night mode">
    <svg class="sunsvg" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round">
      <circle cx="12" cy="12" r="4.2"/>
      <path d="M12 2.5v2.2M12 19.3v2.2M2.5 12h2.2M19.3 12h2.2M5.3 5.3l1.6 1.6M17.1 17.1l1.6 1.6M18.7 5.3l-1.6 1.6M6.9 17.1l-1.6 1.6"/>
    </svg>
    <svg class="moon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
      <path d="M20 14.5A8.5 8.5 0 0 1 9.5 4 8.5 8.5 0 1 0 20 14.5z"/>
    </svg>
  </button>
  <a href="index.html#hey">Hey</a>
  <a href="index.html#work">Work</a>
  <a href="projects.html" class="active">Projects</a>
  <a href="index.html#story">Story</a>
  <a href="index.html#chat">Chat</a>
</div>

<header class="top">
  <h1>Projects</h1>
  <p>things i've built.</p>
</header>

<main class="list">
  <p class="label" id="count"></p>
  <div id="projects"></div>
</main>

<div class="foot">© 2026 Jamyandagva Zulkhuu</div>

<script>
/* theme (shared with the home page) */
(function(){
  const root=document.documentElement;
  try{ if(localStorage.getItem('theme')==='dark') root.setAttribute('data-theme','dark'); }catch(e){}
  document.getElementById('theme').addEventListener('click',()=>{
    const dark=root.getAttribute('data-theme')==='dark';
    root.classList.add('theming');
    clearTimeout(window.__t);window.__t=setTimeout(()=>root.classList.remove('theming'),400);
    if(dark) root.removeAttribute('data-theme'); else root.setAttribute('data-theme','dark');
    try{ localStorage.setItem('theme',dark?'light':'dark'); }catch(e){}
  });
})();

const IMG=/\.(png|jpe?g|gif|webp|avif|svg)$/i;
const VID=/\.(mp4|mov|webm)$/i;
const $=id=>document.getElementById(id);
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const pretty=s=>s.replace(/[-_]+/g,' ').replace(/\b\w/g,c=>c.toUpperCase());

/* 1) projects/projects.json made by build-projects.js
   2) fallback: read the folder listing from a local dev server (python3 -m http.server) */
async function fromGitHub(){
  const h=location.hostname;
  if(!h.endsWith('.github.io')) return null;
  const owner=h.split('.')[0], repo=h; // user site: <name>.github.io
  const api=p=>fetch(`https://api.github.com/repos/${owner}/${repo}/contents/${p}`).then(r=>r.ok?r.json():Promise.reject());
  const dirs=(await api('projects')).filter(x=>x.type==='dir'&&!x.name.startsWith('_'));
  return Promise.all(dirs.map(async d=>{
    let info={};
    try{const j=await fetch(`projects/${encodeURIComponent(d.name)}/project.json`,{cache:'no-cache'});if(j.ok) info=await j.json();}catch(e){}
    let files=[];
    try{files=(await api('projects/'+d.name)).map(f=>f.name).filter(n=>IMG.test(n)||VID.test(n))
      .sort((a,b)=>(/^cover\./i.test(b)-/^cover\./i.test(a))||a.localeCompare(b,undefined,{numeric:true}));}catch(e){}
    return {folder:d.name,title:pretty(d.name),...info,files};
  })).then(l=>l.sort((a,b)=>(a.order??1e9)-(b.order??1e9)||(Date.parse(b.date)||0)-(Date.parse(a.date)||0)||a.title.localeCompare(b.title)));
}

async function loadProjects(){
  try{ const g=await fromGitHub(); if(g) return g; }catch(e){}
  try{
    const r=await fetch('projects/projects.json',{cache:'no-cache'});
    if(r.ok) return await r.json();
  }catch(e){}
  try{
    const r=await fetch('projects/');
    if(!r.ok) return [];
    const doc=new DOMParser().parseFromString(await r.text(),'text/html');
    const dirs=[...doc.querySelectorAll('a')].map(a=>a.getAttribute('href'))
      .filter(h=>h&&h.endsWith('/')&&!h.startsWith('.')&&!h.startsWith('/')&&!h.includes('..'))
      .map(h=>decodeURIComponent(h.replace(/\/$/,'')));
    const out=[];
    for(const d of dirs){
      let info={};
      try{const j=await fetch(`projects/${d}/project.json`);if(j.ok) info=await j.json();}catch(e){}
      const files=[];
      try{
        const l=await fetch(`projects/${d}/`);
        const ld=new DOMParser().parseFromString(await l.text(),'text/html');
        ld.querySelectorAll('a').forEach(a=>{const h=a.getAttribute('href');if(h&&(IMG.test(h)||VID.test(h)))files.push(decodeURIComponent(h));});
      }catch(e){}
      out.push({folder:d,title:pretty(d),...info,files});
    }
    return out;
  }catch(e){return [];}
}

function render(list){
  const box=$('projects');
  if(!list.length){
    $('count').textContent='';
    box.innerHTML=`<div class="empty">No projects yet. Make a folder in <code>projects/</code> (e.g. <code>projects/my-app/</code>), add a <code>project.json</code> and a <code>cover.png</code>, then run <code>node build-projects.js</code>.</div>`;
    return;
  }
  $('count').textContent=`${list.length} project${list.length>1?'s':''}`;
  box.innerHTML=list.map((p,i)=>{
    const base=`projects/${encodeURIComponent(p.folder)}/`;
    const files=p.files||[];
    const media=files.map(f=>{
      const u=base+f.split('/').map(encodeURIComponent).join('/');
      return VID.test(f)?`<video src="${u}" controls playsinline muted loop></video>`:`<img src="${u}" alt="${esc(p.title)}" loading="lazy">`;
    });
    if(p.demo) media.unshift(`<iframe src="${base}${esc(p.demo)}" title="${esc(p.title)} demo" loading="lazy"></iframe>`);
    const tags=(p.tags||[]).map(t=>`<span>${esc(t)}</span>`).join('');
    const links=(p.links||[]).map(l=>`<a href="${esc(l.url)}" target="_blank" rel="noopener">${esc(l.label)} ↗</a>`).join('');
    return `
    <article class="proj fade" style="animation-delay:${i*60}ms" id="${esc(p.folder)}">
      <button class="head" type="button" aria-expanded="false">
        <div><h3>${esc(p.title)}</h3>${p.role?`<p class="role">${esc(p.role)}</p>`:''}</div>
        <div class="meta"><span>${esc(p.date||'')}</span><span class="plus">+</span></div>
      </button>
      <div class="body"><div>
        <div class="inner">
          <div>
            <p class="desc">${esc(p.description||'')}</p>
            ${tags?`<div class="tags">${tags}</div>`:''}
            ${links?`<div class="links">${links}</div>`:''}
          </div>
          ${media.length?`<div class="media">${media.join('')}</div>`:''}
        </div>
      </div></div>
    </article>`;
  }).join('');

  box.querySelectorAll('.head').forEach(h=>h.addEventListener('click',()=>{
    const p=h.parentElement,open=!p.classList.contains('open');
    p.classList.toggle('open',open);
    h.setAttribute('aria-expanded',open);
    if(open) history.replaceState(null,'','#'+p.id);
  }));
  const hash=decodeURIComponent(location.hash.slice(1));
  const target=hash&&document.getElementById(hash);
  if(target&&target.classList.contains('proj')){
    target.querySelector('.head').click();
    setTimeout(()=>target.scrollIntoView({block:'start',behavior:'smooth'}),300);
  }
}

loadProjects().then(render);
</script>
</body>
</html>
